# Pond configuration. Every setting is described in
# https://github.com/FrogPak/engine/blob/main/docs/configuration.md

pond:
  title: FuriHub
  subtitle: A Flatpak remote for apps built by and for the FuriLabs user community
  remote: furihub
  arches:
    - aarch64
  logo-square: assets/logo-square.svg
  logo-square-dark: assets/logo-square-dark.svg
  logo-wide: assets/logo-wide.svg
  logo-wide-dark: assets/logo-wide-dark.svg
  #favicon: assets/icon.svg
  #css: assets/custom.css
  theme:
    mode: dark
    accent: 486e20
    accent-dark: 90dd40
    background: f0f0f4
    background-dark: 2e2e33
  order: name

apps:
  # One entry per app: its app ID, then the repository whose releases hold
  # its .flatpak files.
  #org.example.MyApp:
  #  repo: example/myapp  # for GitHub repos
  #  assets: "{app_id}-{arch}.flatpak"  # Default format (can be omitted)
  #org.example.Notes:
  #  repo: https://codeberg.org/alex/notes # Codeberg repos do not need 'forge' set
  #  assets: "{app_id}.flatpak"
  #org.example.Paint:
  #  repo: https://forge.example.org/alex/paint
  #  forge: forgejo
  #  assets: "{name}-*-{arch}.flatpak"
  #org.example.Mail:
  #  repo: https://git.example.org/lisa/mail
  #  forge: gitea
  #  assets: "{name}-{arch}-latest.flatpak"

include:
  - pond.d/com.luigi311.yml
  - pond.d/de.cais.yml
  - pond.d/io.github.deluxo.yml
  - pond.d/io.github.nico359.yml
  - pond.d/io.github.shinyvision.yml
  - pond.d/net.dunevent.yml
  #- pond.d/example.yml
